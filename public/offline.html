<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tokopedia Clone — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      padding: 24px;
      text-align: center;
      color: #31353b;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #03AC0E;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      font-size: 40px;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 14px; color: #6d7588; line-height: 1.6; max-width: 300px; margin-bottom: 24px; }
    button {
      background: #03AC0E;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="icon">T</div>
  <h1>Kamu sedang offline</h1>
  <p>Periksa koneksi internetmu, lalu coba lagi.</p>
  <button onclick="location.reload()">Coba Lagi</button>
</body>
</html>
